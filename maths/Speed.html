            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'success-step') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'victory') {
                    const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.type = 'sine';
                        o.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
                        g.gain.setValueAtTime(0.08, audioCtx.currentTime + idx * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.4);
                        o.start(audioCtx.currentTime + idx * 0.1);
                        o.stop(audioCtx.currentTime + idx * 0.1 + 0.4);
                    });
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {
                console.log("Audio play blocked or not supported", e);
            }

            { id: 21, displayExpression: [{text:"999"},{text:"×"},{text:"42", isCF:true},{text:"+"},{text:"42", isCF:true, isSingle:true}], commonFactor: 42, bracketSolution: ["999", "+", "1"], simplifiedEquation: "42 × ( 999 + 1 ) = 42 × 1000", correctAnswer: 42000, hint: "「+42」提取後，別忘了它背後默默守護的「1」！", implicitExplanation: "提取公因數 42 後，括號內是 999 + 1 = 1000，算出來是 42000！" },
            { id: 22, displayExpression: [{text:"18", isCF:true},{text:"×"},{text:"9"},{text:"+"},{text:"18", isCF:true, isSingle:true},{text:"+"},{text:"18", isCF:true},{text:"×"},{text:"90"}], commonFactor: 18, bracketSolution: ["9", "+", "1", "+", "90"], simplifiedEquation: "18 × ( 9 + 1 + 90 ) = 18 × 100", correctAnswer: 1800, hint: "中間落單的「18」記得要變成括號裡的「+1」喔！", implicitExplanation: "沒錯！提取 18 後，括號中對應的位置填入「1」，總和為 100。" },
            { id: 23, displayExpression: [{text:"85", isCF:true},{text:"×"},{text:"11"},{text:"-"},{text:"85", isCF:true, isSingle:true}], commonFactor: 85, bracketSolution: ["11", "-", "1"], simplifiedEquation: "85 × ( 11 - 1 ) = 85 × 10", correctAnswer: 850, hint: "「減 85」代表「減去 85 × 1」，提取 85 後括號內是 11 - 1。", implicitExplanation: "很好！11 - 1 = 10，所以 85 × 10 輕鬆心算算出 850！" },
            { id: 24, displayExpression: [{text:"99"},{text:"×"},{text:"15", isCF:true},{text:"+"},{text:"15", isCF:true, isSingle:true}], commonFactor: 15, bracketSolution: ["99", "+", "1"], simplifiedEquation: "15 × ( 99 + 1 ) = 15 × 100", correctAnswer: 1500, hint: "「+15」提取後，括號內是 99 + 1 = 100。", implicitExplanation: "提取公因數 15，括號內為 99 + 1 ＝ 100，答案為 1500！" }
        ];

        let activeProblems = []; // Will hold 8 randomly shuffled questions
        let currentLevelIndex = 0;
        let score = 0;
        let gameState = "find_common"; // Stages: "find_common", "bracket_filling", "solving", "completed"

        // Timer State Variables
        let timerInterval = null;
        const totalDuration = 300; // 5 minutes in seconds
        let timeLeft = totalDuration;

        // HTML element selectors
        const equationContainer = document.getElementById("equation-container");
        const targetCommonFactor = document.getElementById("target-common-factor");
        const targetBracket = document.getElementById("target-bracket");
        const tokenBankContainer = document.getElementById("token-bank-container");
        const tokenBank = document.getElementById("token-bank");
        const mascotText = document.getElementById("mascot-text");
        const step2Section = document.getElementById("step-2-section");
        const step3Section = document.getElementById("step-3-section");
        const simplifiedEquation = document.getElementById("simplified-equation");
        const finalAnswerInput = document.getElementById("final-answer-input");
        const currentLevelNum = document.getElementById("current-level-num");
        const starCount = document.getElementById("star-count");
        const levelDots = document.getElementById("level-dots");
        const difficultyBadge = document.getElementById("difficulty-badge");
        const timerDisplay = document.getElementById("timer-display");

        // Initialization
        window.onload = function() {
            createProgressDots();
            startGame();
        }

        // Shuffle questions helper
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Start / Reset game logic
        function startGame() {
            activeProblems = shuffleArray(problemsPool).slice(0, 8); // Pick 8 random questions
            currentLevelIndex = 0;
            score = 0;
            starCount.innerText = score;
            
            // Start Timer
            clearInterval(timerInterval);
            timeLeft = totalDuration;
            updateTimerUI();
            startTimer();

            // Load first question
            loadLevel(currentLevelIndex);
        }

        // Timer Functions
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showTimeOut();
                }
            }, 1000);
        }

        function updateTimerUI() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Create progress dots
        function createProgressDots() {
            levelDots.innerHTML = "";
            for (let i = 0; i < 8; i++) {
                const dot = document.createElement("div");
                dot.id = `dot-${i}`;
                dot.className = "w-3 h-3 rounded-full bg-slate-200 border border-slate-300 transition-all";
                levelDots.appendChild(dot);
            }
        }

        function updateProgressDots() {
            for (let i = 0; i < 8; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < currentLevelIndex) {
                    dot.className = "w-3 h-3 rounded-full bg-indigo-600 border border-indigo-700";
                } else if (i === currentLevelIndex) {
                    dot.className = "w-3 h-3 rounded-full bg-amber-400 border border-amber-500 scale-125 animate-pulse";
                } else {
                    dot.className = "w-3 h-3 rounded-full bg-slate-200 border border-slate-300";
                }
            }
        }

        // Load specific level
        function loadLevel(index) {
            if (index >= 8) {
                showVictory();
                return;
            }

            currentLevelIndex = index;
            const levelData = activeProblems[index];
            gameState = "find_common";

            // Determine Difficulty & Highlight Mode
            // From Level 5 (index 4) onwards, no highlighting
            const isHighlightMode = (index < 4);

            // Update UI indicators
            currentLevelNum.innerText = index + 1;
            updateProgressDots();

            if (isHighlightMode) {
                difficultyBadge.innerText = "基礎提示";
                difficultyBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-green-100 text-green-700";
            } else {
                difficultyBadge.innerText = "自主判斷";
                difficultyBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-700";
            }

            targetCommonFactor.innerText = "?";
            targetCommonFactor.className = "w-16 h-16 md:w-20 md:h-20 rounded-2xl border-2 border-yellow-400 flex items-center justify-center text-xl md:text-2xl font-black bg-yellow-50 text-yellow-600 animate-pulse-yellow transition-all duration-300 cursor-pointer";
            
            targetBracket.innerHTML = `<span class="text-slate-300 italic text-sm select-none">請先提取相同數字...</span>`;
            
            tokenBankContainer.classList.add("hidden");
            tokenBank.innerHTML = "";
            
            step2Section.classList.add("opacity-50");
            step3Section.classList.add("opacity-50");
            step3Section.classList.add("pointer-events-none");

            simplifiedEquation.innerHTML = "";
            finalAnswerInput.value = "";
            finalAnswerInput.className = "w-full sm:w-36 text-center text-xl font-bold py-2 px-4 rounded-xl border-2 border-indigo-200 focus:outline-none focus:border-indigo-500 transition shadow-sm bg-white";

            // Load Equation Tokens in Top Area
            equationContainer.innerHTML = "";
            levelData.displayExpression.forEach((token, tokenIdx) => {
                const span = document.createElement("span");
                span.innerText = token.text;
                
                // Only numbers are clickable to let students select the common factor
                const isNumber = !isNaN(token.text);

                if (isNumber) {
                    span.id = `eq-token-${tokenIdx}`;
                    span.classList.add("cursor-pointer", "select-none", "rounded-xl", "px-2.5", "py-1.5", "transition-all", "duration-300");

                    if (token.isCF && isHighlightMode) {
                        // Highlight Mode (Q1-Q4): Breathing effect with soft blue
                        span.className += " bg-blue-100 text-blue-700 hover:bg-blue-200 border border-blue-200 shadow-sm animate-breath text-2xl md:text-3xl font-black";
                    } else {
                        // Regular Look (No highlight for Q5-Q8, or non-common factor numbers)
                        span.className += " text-slate-800 text-2xl md:text-3xl hover:bg-slate-100";
                    }

                    // Click handler to verify if they clicked the correct common factor
                    span.onclick = () => handleCommonFactorClick(token, tokenIdx);
                } else {
                    // Operators
                    span.className = "text-slate-500 text-xl md:text-2xl transition-all duration-500 select-none font-bold";
                    span.id = `eq-token-${tokenIdx}`;
                }
                
                equationContainer.appendChild(span);
            });
        }

        // Handle selection of common factor (with incorrect click shake feedback)
        function handleCommonFactorClick(token, idx) {
            if (gameState !== "find_common") return;

            const levelData = activeProblems[currentLevelIndex];
            const clickedVal = parseInt(token.text);

            if (clickedVal === levelData.commonFactor) {
                // Correct Choice!
                selectCommonFactor(token.text);
            } else {
                // Incorrect Choice: shake and flash red
                playSound('wrong');
                const wrongEl = document.getElementById(`eq-token-${idx}`);
                wrongEl.classList.add("animate-shake", "bg-red-100", "text-red-500", "border", "border-red-300");
                setTimeout(() => {
                    wrongEl.classList.remove("animate-shake", "bg-red-100", "text-red-500", "border", "border-red-300");
                }, 400);
            }
        }

        // STAGE 1 Success: Selecting the correct Common Factor
        function selectCommonFactor(val) {
            playSound('success-step');
            gameState = "bracket_filling";
            
            const levelData = activeProblems[currentLevelIndex];

            // Animate transition of Common Factor to target
            targetCommonFactor.innerText = val;
            targetCommonFactor.className = "w-16 h-16 md:w-20 md:h-20 rounded-2xl border-2 border-indigo-500 bg-indigo-50 text-indigo-700 text-xl md:text-2xl font-black flex items-center justify-center transition-all duration-300 shadow-md";

            // Visual feedback on expression: Hide/fade common factors, emphasize remaining numbers
            levelData.displayExpression.forEach((token, idx) => {
                const el = document.getElementById(`eq-token-${idx}`);
                const isNumber = !isNaN(token.text);
                if (isNumber) {
                    el.onclick = null; // Disable further clicking on expression numbers
                    
                    if (token.isSingle) {
                        // Modified to match the visual depth of other common factors perfectly!
                        // It now fades out with 30% opacity (opacity-30) and slate-300 color.
                        // The trailing "× 1" is styled with text-slate-600 to make it slightly darker and easier to read.
                        el.classList.remove("animate-breath", "bg-blue-100", "text-blue-700");
                        el.classList.add("text-slate-300", "scale-90", "opacity-30", "border-transparent", "shadow-none");
                        el.innerHTML = `${token.text} <span class="text-slate-600 font-bold select-none ml-1">× 1</span>`;
                    } else if (parseInt(token.text) === levelData.commonFactor) {
                        // Ordinary common factor: Fades away to 30% opacity
                        el.classList.remove("animate-breath", "bg-blue-100", "text-blue-700");
                        el.classList.add("text-slate-300", "scale-90", "opacity-30", "border-transparent", "shadow-none");
                    } else {
                        // Regular remaining numbers
                        el.classList.add("text-slate-400");
                    }
                }
            });

            // Enable Step 2 Area & Setup interactive fields
            step2Section.classList.remove("opacity-50");
            setupBracketFields();
        }

        // STAGE 2: Setup Interactive inputs and selectors inside the bracket
        function setupBracketFields() {
            const levelData = activeProblems[currentLevelIndex];
            targetBracket.innerHTML = "";

            levelData.bracketSolution.forEach((item, idx) => {
                if (isNaN(item)) {
                    // It's an operator (+ or -) -> Create a styled SELECT element
                    const container = document.createElement("div");
                    container.className = "relative flex items-center";

                    const select = document.createElement("select");
                    select.id = `bracket-op-${idx}`;
                    select.className = "bg-amber-50 border-2 border-amber-200 text-amber-800 font-extrabold rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-amber-400 text-lg md:text-xl transition-all shadow-sm cursor-pointer appearance-none text-center min-w-[50px] md:min-w-[60px]";
                    
                    // Options
                    const optDefault = document.createElement("option");
                    optDefault.value = "";
                    optDefault.text = "？";
                    select.appendChild(optDefault);

                    const optPlus = document.createElement("option");
                    optPlus.value = "+";
                    optPlus.text = "＋";
                    select.appendChild(optPlus);

                    const optMinus = document.createElement("option");
                    optMinus.value = "-";
                    optMinus.text = "－";
                    select.appendChild(optMinus);

                    select.onchange = () => playSound('click');

                    container.appendChild(select);
                    targetBracket.appendChild(container);
                } else {
                    // It's a number -> Create an INPUT element
                    const input = document.createElement("input");
                    input.type = "text";
                    input.inputMode = "numeric";
                    input.pattern = "[0-9]*";
                    input.id = `bracket-num-${idx}`;
                    input.placeholder = "？";
                    input.className = "w-16 h-12 md:w-20 md:h-14 bg-indigo-50 border-2 border-indigo-200 text-indigo-700 font-extrabold rounded-xl text-center focus:outline-none focus:border-indigo-500 text-lg md:text-xl transition-all shadow-sm focus:bg-white";

                    targetBracket.appendChild(input);
                }
            });

            // Auto-focus the first numeric input inside the bracket
            const firstInput = targetBracket.querySelector("input");
            if (firstInput) {
                setTimeout(() => firstInput.focus(), 100);
            }

            // Create verification button in place of the old token bank
            tokenBankContainer.classList.remove("hidden");
            tokenBank.innerHTML = `
                <button onclick="verifyBracketAnswers()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3 px-8 rounded-2xl transition shadow-md shadow-indigo-100 flex items-center gap-2 text-base">
                    確認括號填寫
                </button>
            `;
        }

        // STAGE 2 Verification: Check if bracket fields match the solution
        function verifyBracketAnswers() {
            if (gameState !== "bracket_filling") return;

            const levelData = activeProblems[currentLevelIndex];
            let allCorrect = true;

            levelData.bracketSolution.forEach((expectedVal, idx) => {
                if (isNaN(expectedVal)) {
                    // Verify operator dropdown
                    const select = document.getElementById(`bracket-op-${idx}`);
                    if (select.value !== expectedVal) {
                        allCorrect = false;
                        select.className = "bg-red-50 border-2 border-red-400 text-red-500 font-extrabold rounded-xl px-2.5 py-1.5 text-lg md:text-xl text-center min-w-[50px] md:min-w-[60px] animate-shake focus:outline-none";
                        setTimeout(() => select.classList.remove("animate-shake"), 400);
                    } else {
                        select.className = "bg-green-50 border-2 border-green-400 text-green-700 font-extrabold rounded-xl px-2.5 py-1.5 text-lg md:text-xl text-center min-w-[50px] md:min-w-[60px] focus:outline-none";
                    }
                } else {
                    // Verify numeric input
                    const input = document.getElementById(`bracket-num-${idx}`);
                    if (input.value.trim() !== expectedVal) {
                        allCorrect = false;
                        input.className = "w-16 h-12 md:w-20 md:h-14 bg-red-50 border-2 border-red-400 text-red-500 font-extrabold rounded-xl text-center animate-shake focus:outline-none";
                        setTimeout(() => input.classList.remove("animate-shake"), 400);
                    } else {
                        input.className = "w-16 h-12 md:w-20 md:h-14 bg-green-50 border-2 border-green-400 text-green-700 font-extrabold rounded-xl text-center focus:outline-none";
                    }
                }
            });

            if (allCorrect) {
                // Lock all inputs & dropdowns so they cannot be edited
                levelData.bracketSolution.forEach((expectedVal, idx) => {
                    if (isNaN(expectedVal)) {
                        document.getElementById(`bracket-op-${idx}`).disabled = true;
                    } else {
                        document.getElementById(`bracket-num-${idx}`).disabled = true;
                    }
                });
                
                // Proceed to next step
                completeStep2();
            } else {
                playSound('wrong');
            }
        }

        // STAGE 2 Complete -> Enable Final Calculation
        function completeStep2() {
            playSound('success-step');
            gameState = "solving";
            
            const levelData = activeProblems[currentLevelIndex];

            // Hide verification button
            tokenBankContainer.classList.add("hidden");

            // Open Step 3
            step2Section.classList.add("opacity-50");
            step3Section.classList.remove("opacity-50");
            step3Section.classList.remove("pointer-events-none");

            // Display simplified equation
            simplifiedEquation.innerHTML = `${levelData.simplifiedEquation.split('=')[0]} = `;
            
            // Focus on final answer field
            finalAnswerInput.focus();
        }

        // Check Third Step: Final Answer
        function checkFinalAnswer() {
            if (gameState !== "solving") return;

            const levelData = activeProblems[currentLevelIndex];
            const studentVal = parseInt(finalAnswerInput.value);

            if (studentVal === levelData.correctAnswer) {
                // CORRECT ANSWER!
                playSound('success-step');
                finalAnswerInput.className = "w-full sm:w-36 text-center text-xl font-bold py-2 px-4 rounded-xl border-2 border-green-500 bg-green-50 text-green-700 transition shadow-sm";
                triggerConfetti();

                score += 3; // 3 stars per question
                starCount.innerText = score;

                // Brief pause before next level
                setTimeout(() => {
                    currentLevelIndex++;
                    loadLevel(currentLevelIndex);
                }, 1600);

            } else {
                // WRONG ANSWER
                playSound('wrong');
                finalAnswerInput.className = "w-full sm:w-36 text-center text-xl font-bold py-2 px-4 rounded-xl border-2 border-red-500 bg-red-50 text-red-500 transition shadow-sm animate-shake";
                setTimeout(() => {
                    finalAnswerInput.classList.remove("animate-shake");
                }, 500);
            }
        }

        // Reset game to level 1 with a confirmation prompt
        function resetGame() {
            if(confirm("確定要重頭開始挑戰並洗牌題目嗎？")) {
                restartFromBeginning();
            }
        }

        function restartFromBeginning() {
            // Hide Modals
            document.getElementById("victory-modal").classList.add("hidden");
            document.getElementById("timeout-modal").classList.add("hidden");
            startGame();
        }

        // Show final success screen
        function showVictory() {
            gameState = "completed";
            clearInterval(timerInterval); // Stop timer
            playSound('victory');
            triggerConfettiContinuous();

            // Calculate remaining time for victory display
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById("victory-time").innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            document.getElementById("victory-modal").classList.remove("hidden");
        }

        // Show Time Out Screen
        function showTimeOut() {
            gameState = "completed";
            playSound('wrong');
            document.getElementById("timeout-modal").classList.remove("hidden");
        }

        // Support physical keyboard (Enter key)
        window.onkeydown = function(e) {
            if (e.key === "Enter") {
                if (gameState === "bracket_filling") {
                    verifyBracketAnswers();
                } else if (gameState === "solving") {
                    checkFinalAnswer();
                }
            }
        }

        // NATIVE CONFETTI ANIMATION (Zero dependencies)
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let confetti = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function triggerConfetti() {
            confetti = [];
            for (let i = 0; i < 80; i++) {
                confetti.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 100,
                    size: randomRange(6, 12),
                    color: `hsl(${randomRange(0, 360)}, 80%, 60%)`,
                    speedX: randomRange(-6, 6),
                    speedY: randomRange(-15, -5),
                    gravity: 0.4,
                    rotation: randomRange(0, 360),
                    rotationSpeed: randomRange(-5, 5),
                    opacity: 1
                });
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animateConfetti();
        }

        function triggerConfettiContinuous() {
            confetti = [];
            for (let i = 0; i < 150; i++) {
                confetti.push({
                    x: randomRange(0, canvas.width),
                    y: randomRange(-50, -10),
                    size: randomRange(6, 12),
                    color: `hsl(${randomRange(0, 360)}, 80%, 60%)`,
                    speedX: randomRange(-2, 2),
                    speedY: randomRange(2, 6),
                    gravity: 0.1,
                    rotation: randomRange(0, 360),
                    rotationSpeed: randomRange(-2, 2),
                    opacity: 1
                });
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animateConfettiLoop();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let alive = false;
            confetti.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.speedY += p.gravity;
                p.rotation += p.rotationSpeed;
                p.opacity -= 0.015;

                if (p.opacity > 0) {
                    alive = true;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.opacity;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                }
            });

            if (alive) {
                animationFrameId = requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function animateConfettiLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confetti.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.rotation += p.rotationSpeed;

                if (p.y > canvas.height) {
                    p.y = -20;
                    p.x = randomRange(0, canvas.width);
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            });
            if (gameState === "completed") {
                animationFrameId = requestAnimationFrame(animateConfettiLoop);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
